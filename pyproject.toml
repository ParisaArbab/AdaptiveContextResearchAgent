[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "adaptive-context-research-agent"
version = "0.1.0"
description = "Safe external experiment controller for AdaptiveContextOpt"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=7"]
[tool.setuptools.packages.find]
include = ["research_agent*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "workspaces", "tools", "runs"]
